<style>
/* Layout: a study notebook. Day tabs on top, one card per question, instant feedback, score saved per day. */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

 --accent:#8fb0ff; --accent-ink:#141414; --ok:#74d39e; --ok-bg:#17301f; --bad:#ff8f86; --bad-bg:#3b1c19; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#14161b; --card:#1d2027; --ink:#eceef3; --muted:#a4aab7; --line:#323642; --soft:#262a33;

body{background:var(--bg);color:var(--ink);font:17px/1.6 var(--body);margin:0}

.stat b{font-variant-numeric:tabular-nums}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;flex-basis:100%}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:.9rem;cursor:pointer;padding:4px 0}
h2.dayt{font-size:1.25rem;margin:4px 0 12px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt .n{color:var(--accent);font-family:var(--display);min-width:1.6em}
.q .qt .tx{white-space:pre-line}
.blank{display:inline-block;min-width:2.4em;border-bottom:2px solid var(--accent);text-align:center}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{font:inherit;font-size:1.02rem;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;min-height:46px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{font:700 .9rem var(--display);color:var(--muted);padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}

.fb .ok{color:var(--ok)} .fb .no{color:var(--bad)}

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.done b{font:800 1.4rem var(--display)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;z-index:60;font-size:.92rem;max-width:calc(100% - 32px);text-align:center}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

var LANG="ko-KR", KEY="ko5-practice", TARGET=/[\uac00-\ud7af]/;

   '<div class="opts">'+ORDER[id].map(function(k,p){var cls=done?(k===1?' right':(S["pick"+id]===k?' wrong':'')):'';
